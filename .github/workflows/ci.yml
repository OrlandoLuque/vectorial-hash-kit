name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Native: fmt + clippy + tests for the library crates. The demos crate
  # (macroquad/GUI) and the optional `redis-store` feature are intentionally
  # excluded here — the demos are covered by the wasm job below, and redis needs
  # a running server. Everything tested here is dependency-light and offline.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Advisory only: this codebase uses a deliberately dense hand-formatting
      # style (one-line match arms / impls) that rustfmt would expand, so fmt is
      # informational, not a gate. clippy + tests below are the real gates.
      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # Hard gate on the flagship crate (kept clippy-clean).
      - name: clippy (vectorial-hash — gate)
        run: cargo clippy -p vectorial-hash --all-targets -- -D warnings

      - name: clippy (vectorial-hash, parallel feature — gate)
        run: cargo clippy -p vectorial-hash --all-targets --features parallel -- -D warnings

      # Gate: templates + cli are now clippy-clean (the cleanup pass landed —
      # grid-indexing lints allowed with justification, the rest fixed).
      - name: clippy (templates + cli — gate)
        run: cargo clippy -p vectorial-hash-templates -p vectorial-hash-cli --all-targets -- -D warnings

      - name: test (vectorial-hash — gate)
        run: cargo test -p vectorial-hash

      - name: test (vectorial-hash, parallel feature — gate)
        run: cargo test -p vectorial-hash --features parallel

      - name: Test vectorial-hash (grid-stats — the cell-visit ratchet)
        # The cell counts are as deterministic as the point counts and are gated with `==`
        # like them, but they only exist under this feature, so without a job that enables it
        # the ratchet would sit in the repo checking nothing.
        run: cargo test -p vectorial-hash --features grid-stats

      # Gate: templates + cli tests. The fingerprint-regression test is now
      # portable — it hard-checks determinism + row structure everywhere, and
      # the fixture bytes within a cross-platform tolerance (libm ULPs at tangent
      # cells can flip a few of ~14k rows). Exact byte review runs on the
      # reference platform via VH_FINGERPRINT_STRICT=1.
      - name: test (templates + cli — gate)
        run: cargo test -p vectorial-hash-templates -p vectorial-hash-cli

      - name: benches + examples compile
        run: |
          cargo bench -p vectorial-hash --no-run
          cargo build -p vectorial-hash --examples --release

      # Informational only — the committed baseline is hardware-specific, and CI
      # runners differ in microarchitecture, so this is not a gate (wide
      # threshold + non-fatal). Run the gate locally to actually catch
      # regressions. See crates/vectorial-hash/benches/README.md.
      - name: regression gate (informational)
        continue-on-error: true
        run: cargo run -p vectorial-hash --example regression_gate --release -- --threshold 1.0

  # The web demos must keep building for the wasm target (GitHub Pages site).
  # No GUI system libraries needed: miniquad resolves GL/clock as JS imports.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Advisory only: mtimes mean nothing in a fresh clone (every file gets the checkout
      # time), so this cannot FAIL here — it exists so the log shows the table, and so the
      # script itself keeps working. The check that matters is run locally before publishing.
      - name: web publish freshness (advisory)
        continue-on-error: true
        run: bash scripts/check-web-fresh.sh --list

      # This one CAN gate: it reads only file contents, so a fresh clone gives the same answer
      # as a working copy. A broken link or a measurement nobody can reproduce is a defect in
      # the repository, not a property of the machine it was checked on.
      - name: docs are reproducible (links, anchors, named sources)
        run: bash scripts/check-docs-numbers.sh

      - name: build web demos (wasm32)
        run: cargo build --target wasm32-unknown-unknown -p vectorial-hash-demos --bin critters --bin critters3d --release
