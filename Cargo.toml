[workspace]
resolver = "2"
members = [
    "crates/vectorial-hash",
    "crates/vectorial-hash-templates",
    "crates/vectorial-hash-cli",
    "crates/vectorial-hash-demos",
    "crates/bench-runner",
]

[workspace.package]
authors = ["Orlando Jose Luque Moraira <orlando.luque@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OrlandoLuque/vectorial-hash-kit"
rust-version = "1.85"

[workspace.dependencies]
vectorial-hash = { version = "0.1.0", path = "crates/vectorial-hash" }
vectorial-hash-templates = { version = "0.1.0", path = "crates/vectorial-hash-templates" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
redis = "0.29"
dotenv = "0.15"
clap = { version = "4", features = ["derive"] }
macroquad = "0.4"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
