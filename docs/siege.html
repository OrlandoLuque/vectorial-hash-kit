<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // wgpu-first (user 2026-07-19): the wgpu build renders better — incl. on mobile —
  // so if this browser has WebGPU, hop to the GPU-skinned Siege before loading the
  // heavier WebGL wasm. Browsers WITHOUT WebGPU (Firefox, older Safari/iOS, older
  // Android) fall through and get this working WebGL (macroquad) build as the fallback.
  if (navigator.gpu) { location.replace('siege_wgpu.html' + location.search + location.hash); }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siege — vectorial-hash-kit</title>
<style>
  html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0c14; }
  /* The demo lays itself out from screen_width()/screen_height(), so it already
     adapts to the canvas — just let the canvas fill the viewport. */
  canvas { display:block; width:100vw; height:100vh; }
  #back, #hide { position:fixed; z-index:10; color:#9fb0d8; font:13px system-ui;
          background:#141a2ccc; padding:6px 11px; border-radius:8px; border:1px solid #2a3550;
          text-decoration:none; cursor:pointer; user-select:none; }
  #back { top:10px; left:12px; }
  #hide { top:10px; right:12px; font-size:16px; line-height:1; }
  #back:hover, #hide:hover { color:#fff; border-color:#4a6cff; }
  body.immersive #back { display:none; }
</style>
</head>
<body>
<a id="back" href="index.html">← demos</a>
<button id="hide" title="Hide page chrome + fullscreen (toggle)">⤢</button>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>
  const cv = document.getElementById('glcanvas');

  // ⤢ — hide the page chrome (back link) and go fullscreen, for mobile.
  const hide = document.getElementById('hide');
  hide.addEventListener('click', () => {
    const on = document.body.classList.toggle('immersive');
    hide.textContent = on ? '⤡' : '⤢';
    try { on ? document.documentElement.requestFullscreen?.() : document.exitFullscreen?.(); } catch (e) {}
    cv.focus();
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('immersive')) {
      document.body.classList.remove('immersive'); hide.textContent = '⤢';
    }
  });
</script>
<script src="mq_js_bundle.js"></script>
<script>load("siege.wasm");</script>
<script type="module">
  import { setupMobileControls } from './mobile-controls.js';
  setupMobileControls({ title: 'Siege', keys: [
    { label: 'Pause', code: 'KeyP', key: 'p', keyCode: 80, cycle: [{ name: 'running' }, { name: 'paused' }] },
    { label: 'Collide', code: 'KeyC', key: 'c', keyCode: 67, cycle: [{ name: 'on', cost: 0.6 }, { name: 'off', cost: 0.2 }] },
    { label: 'Terrain', code: 'KeyV', key: 'v', keyCode: 86, cycle: [{ name: 'voxel', cost: 0.7 }, { name: 'smooth', cost: 0.3 }] },
    { group: 'step', label: 'Pop −', code: 'BracketLeft', key: '[', keyCode: 219, cost: 0.15 },
    { group: 'step', label: 'Pop +', code: 'BracketRight', key: ']', keyCode: 221, cost: 0.85 },
  ]});
</script>
</body>
</html>
