<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2D critters — vectorial-hash-kit</title>
<style>
  html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0c14; }
  /* The 2D demo renders at a fixed logical size (panel + map + graphs). We
     centre the canvas and scale-to-fit (letterbox) so the whole thing is
     visible on any screen, phones included. CSS `transform` does not change
     clientWidth, so macroquad keeps rendering at the native framebuffer size;
     only the displayed pixels scale, and miniquad maps the mouse through the
     (transformed) bounding rect, so input stays aligned. */
  #glcanvas { position:fixed; left:50%; top:50%; width:1398px; height:768px;
              transform:translate(-50%,-50%); transform-origin:center center; }
  #back, #hide, #visual { position:fixed; z-index:10; color:#9fb0d8; font:13px system-ui;
          background:#141a2ccc; padding:6px 11px; border-radius:8px; border:1px solid #2a3550;
          text-decoration:none; cursor:pointer; user-select:none; }
  #back { top:10px; left:12px; }
  #hide { top:10px; right:12px; font-size:16px; line-height:1; }
  #visual { top:46px; right:12px; }
  #back:hover, #hide:hover, #visual:hover { color:#fff; border-color:#4a6cff; }
  #visual.active { color:#fff; border-color:#4a6cff; background:#1d2747ee; }
  body.immersive #back { display:none; }
</style>
</head>
<body>
<a id="back" href="index.html">← demos</a>
<button id="hide" title="Hide page chrome + fullscreen (toggle)">⤢</button>
<button id="visual" title="Show only the demo — hide controls, text &amp; graphs (or press U)">hide UI</button>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>
  // Scale-to-fit the fixed-size 2D demo into the viewport.
  const W = 1398, H = 768, cv = document.getElementById('glcanvas');
  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    cv.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // ⤢ — hide the page chrome (back link) and go fullscreen, for mobile.
  const hide = document.getElementById('hide');
  hide.addEventListener('click', () => {
    const on = document.body.classList.toggle('immersive');
    hide.textContent = on ? '⤡' : '⤢';
    try { on ? document.documentElement.requestFullscreen?.() : document.exitFullscreen?.(); } catch (e) {}
    cv.focus();
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('immersive')) {
      document.body.classList.remove('immersive'); hide.textContent = '⤢';
    }
  });

  // Dispatch a key to the wasm canvas — miniquad listens for keydown/keyup.
  function pressKey(code, key, keyCode) {
    const o = { key, code, keyCode, which: keyCode, bubbles: true };
    cv.dispatchEvent(new KeyboardEvent('keydown', o));
    setTimeout(() => cv.dispatchEvent(new KeyboardEvent('keyup', o)), 40);
  }
  // "hide UI" — presses [U] so the demo hides its own panel / text / graphs,
  // leaving just the rendered critters. Click again (or [U]) to bring it back.
  const visual = document.getElementById('visual');
  let visOn = false;
  visual.addEventListener('click', () => {
    visOn = !visOn;
    visual.classList.toggle('active', visOn);
    visual.textContent = visOn ? 'show UI' : 'hide UI';
    pressKey('KeyU', 'u', 85);
    cv.focus();
  });
</script>
<script src="mq_js_bundle.js"></script>
<script>load("critters.wasm");</script>
<script type="module">
  import { setupMobileControls } from './mobile-controls.js';
  setupMobileControls({ title: 'Critters 2D', keys: [
    { label: 'Pause', code: 'Space', key: ' ', keyCode: 32, cycle: [{ name: 'running' }, { name: 'paused' }] },
    { label: 'Index', sub: 'mode', code: 'KeyM', key: 'm', keyCode: 77 },
    { slider: { steps: 110, start: 12 }, group: 'count', label: 'Critters −', sub: '5 each', code: 'Minus', key: '-', keyCode: 189, cost: 0.2 },
    { group: 'count', label: 'Critters +', sub: '5 each', code: 'Equal', key: '=', keyCode: 187, cost: 0.8 },
    { group: 'step', label: 'Slower', code: 'BracketLeft', key: '[', keyCode: 219 },
    { group: 'step', label: 'Faster', code: 'BracketRight', key: ']', keyCode: 221 },
    { label: 'Region', code: 'KeyR', key: 'r', keyCode: 82, cycle: [{ name: 'fill+lines', cost: 0.6 }, { name: 'lines', cost: 0.4 }, { name: 'off', cost: 0.2 }] },
    { label: 'Dilate', code: 'KeyD', key: 'd', keyCode: 68, cycle: [{ name: 'off' }, { name: 'on' }] },
    { label: 'Hide UI', code: 'KeyU', key: 'u', keyCode: 85, cycle: [{ name: 'shown' }, { name: 'hidden' }] },
    { label: 'Drifter', sub: 'brush', code: 'Digit1', key: '1', keyCode: 49 },
    { label: 'Hunter', sub: 'brush', code: 'Digit2', key: '2', keyCode: 50 },
    { label: 'Pulsar', sub: 'brush', code: 'Digit3', key: '3', keyCode: 51 },
  ]});
</script>
</body>
</html>
