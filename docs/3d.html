<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D critters — vectorial-hash-kit</title>
<style>
  html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0c14; }
  /* The 3D demo lays itself out from screen_width()/screen_height(), so it
     already adapts to the canvas — just let the canvas fill the viewport. */
  canvas { display:block; width:100vw; height:100vh; }
  #back, #hide, #visual { position:fixed; z-index:10; color:#9fb0d8; font:13px system-ui;
          background:#141a2ccc; padding:6px 11px; border-radius:8px; border:1px solid #2a3550;
          text-decoration:none; cursor:pointer; user-select:none; }
  #back { top:10px; left:12px; }
  #hide { top:10px; right:12px; font-size:16px; line-height:1; }
  #visual { top:46px; right:12px; }
  #back:hover, #hide:hover, #visual:hover { color:#fff; border-color:#4a6cff; }
  #visual.active { color:#fff; border-color:#4a6cff; background:#1d2747ee; }
  body.immersive #back { display:none; }
</style>
</head>
<body>
<a id="back" href="index.html">← demos</a>
<button id="hide" title="Hide page chrome + fullscreen (toggle)">⤢</button>
<button id="visual" title="Show only the demo — hide controls, text &amp; graphs (or press U)">hide UI</button>
<canvas id="glcanvas" tabindex="1"></canvas>
<script>
  const cv = document.getElementById('glcanvas');

  // ⤢ — hide the page chrome (back link) and go fullscreen, for mobile.
  const hide = document.getElementById('hide');
  hide.addEventListener('click', () => {
    const on = document.body.classList.toggle('immersive');
    hide.textContent = on ? '⤡' : '⤢';
    try { on ? document.documentElement.requestFullscreen?.() : document.exitFullscreen?.(); } catch (e) {}
    cv.focus();
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && document.body.classList.contains('immersive')) {
      document.body.classList.remove('immersive'); hide.textContent = '⤢';
    }
  });

  // Dispatch a key to the wasm canvas — miniquad listens for keydown/keyup.
  function pressKey(code, key, keyCode) {
    const o = { key, code, keyCode, which: keyCode, bubbles: true };
    cv.dispatchEvent(new KeyboardEvent('keydown', o));
    setTimeout(() => cv.dispatchEvent(new KeyboardEvent('keyup', o)), 40);
  }
  // "hide UI" — presses [U] so the demo hides its HUD / control panel / graphs,
  // leaving just the rendered scene. Click again (or [U]) to bring it back.
  const visual = document.getElementById('visual');
  let visOn = false;
  visual.addEventListener('click', () => {
    visOn = !visOn;
    visual.classList.toggle('active', visOn);
    visual.textContent = visOn ? 'show UI' : 'hide UI';
    pressKey('KeyU', 'u', 85);
    cv.focus();
  });
</script>
<script src="mq_js_bundle.js"></script>
<script>load("critters3d.wasm");</script>
<script type="module">
  import { setupMobileControls } from './mobile-controls.js';
  setupMobileControls({ title: 'Critters 3D', keys: [
    { label: 'Index', code: 'KeyM', key: 'm', keyCode: 77, cycle: [{ name: 'Tree3', cost: 0.45 }, { name: 'Octree3', cost: 0.5 }, { name: 'Morton', cost: 0.3 }, { name: 'Projection', cost: 0.35 }] },
    { label: 'Render', code: 'KeyG', key: 'g', keyCode: 71, cycle: [{ name: 'spheres', cost: 0.8 }, { name: 'billboards', cost: 0.5 }, { name: 'sq bill', cost: 0.35 }, { name: 'no render', cost: 0.1 }] },
    { label: 'Mode', code: 'KeyT', key: 't', keyCode: 84, cycle: [{ name: 'observe' }, { name: 'combat' }] },
    { label: 'Boxes', code: 'KeyB', key: 'b', keyCode: 66, cycle: [{ name: 'off' }, { name: 'on' }] },
    { label: 'Separate', code: 'KeyO', key: 'o', keyCode: 79, cycle: [{ name: 'off', cost: 0.25 }, { name: 'on', cost: 0.55 }] },
    { label: 'Random', sub: 'attacks', code: 'KeyR', key: 'r', keyCode: 82, cycle: [{ name: 'off' }, { name: 'on' }] },
    { label: 'Cull', code: 'KeyC', key: 'c', keyCode: 67, cycle: [{ name: '×1', cost: 0.15 }, { name: '×50', cost: 0.4 }, { name: '×200', cost: 0.65 }, { name: '×1000', cost: 0.95 }] },
    { label: 'FPS cap', code: 'KeyV', key: 'v', keyCode: 86, cycle: [{ name: 'uncapped', cost: 0.8 }, { name: 'capped', cost: 0.3 }] },
    { label: 'Hide UI', code: 'KeyU', key: 'u', keyCode: 85, cycle: [{ name: 'shown' }, { name: 'hidden' }] },
    { group: 'count', label: 'Pop −', code: 'Minus', key: '-', keyCode: 189, cost: 0.15 },
    { group: 'count', label: 'Pop +', code: 'Equal', key: '=', keyCode: 187, cost: 0.85 },
    { group: 'step', label: 'Threads −', code: 'BracketLeft', key: '[', keyCode: 219, cost: 0.6 },
    { group: 'step', label: 'Threads +', code: 'BracketRight', key: ']', keyCode: 221, cost: 0.2 },
  ]});
</script>
</body>
</html>
