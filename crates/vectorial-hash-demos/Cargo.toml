[package]
name = "vectorial-hash-demos"
version = "0.1.0"
description = "Runnable demos for vectorial-hash (insertion, culling, visualisations)."
publish = false  # flip to true if you want crates.io to host the demos too
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Propagates to vectorial-hash so the LcaRopes update strategy is compiled in
# (otherwise it silently degrades to Lca).
neighbors = ["vectorial-hash/neighbors"]
# Enables vectorial-hash's rayon-backed batch cull, used by the
# `critters3d_headless --parallel` crossover benchmark. NOT for the wasm build
# (rayon needs OS threads): only pass this for native bench runs.
parallel = ["vectorial-hash/parallel"]
# Builds the `siege_wgpu` binary for the **web** (WebGPU via wasm-bindgen). Pulls
# the wgpu stack + the wasm glue only when set, so the macroquad critters wasm
# builds stay lean. Pass `--features web-wgpu` to the wasm32 build of `siege_wgpu`.
web-wgpu = ["dep:wgpu", "dep:winit", "dep:glam", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook", "dep:web-sys", "dep:web-time", "dep:getrandom"]

[dependencies]
vectorial-hash = { workspace = true }
vectorial-hash-templates = { workspace = true }
macroquad = { workspace = true }
# glTF (.glb) model loading for the siege demo (Quaternius CC0 kits). Pure Rust,
# so it builds for wasm too. `import` decodes embedded buffers + textures.
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
# Plain-old-data casts for the GPU vertex/bone buffers (SkinVertex). Builds for
# wasm; only the wgpu binary uses the GPU buffers, but the type lives in the lib.
bytemuck = { version = "1", features = ["derive"] }

# rayon powers the `siege` demo's per-unit AI fan-out (a live thread-count
# slider). Native only — wasm has no OS threads, so the web build runs the same
# AI pass serially under cfg(target_arch = "wasm32"). See docs/PARALLEL.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
# The `siege_wgpu` comparison binary (low-level wgpu renderer).
wgpu = "0.20"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"

# `siege_wgpu` on the **web** (WebGPU via wasm-bindgen) — only pulled by the
# `web-wgpu` feature, so the macroquad critters wasm builds don't compile wgpu.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "0.20", optional = true }
winit = { version = "0.29", optional = true }
glam = { version = "0.27", optional = true }
wasm-bindgen = { version = "=0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-time = { version = "1", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "Window", "Element", "HtmlCanvasElement"] }
