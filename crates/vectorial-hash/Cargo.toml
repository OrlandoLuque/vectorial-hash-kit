[package]
name = "vectorial-hash"
version = "0.1.0"
description = "Index and hash algorithms for vectorial spaces, tuned to modern CPU architecture."
keywords = ["index", "hash", "spatial", "quadtree", "octree"]
categories = ["data-structures", "algorithms"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
# Leaf neighbour lists ("ropes") maintained on every split/merge, plus the
# accessor used by the flood-fill cull. Off by default: when disabled, the
# bookkeeping does not exist in the compiled code at all.
neighbors = []
# rayon-backed batch query helpers (`*::cull_many_par`). Off by default: the
# serial `cull_many` is always available and rayon stays out of the dependency
# tree entirely unless this is enabled.
parallel = ["dep:rayon"]
# Counts CELLS VISITED by the Morton grids' queries. Off by default and genuinely absent when
# off: with the feature disabled the counter is not compiled and the hot path is unchanged.
#
# It exists because the repo's clock-free method has a structural blind spot. Wrapping the
# query counts `classify_aabb`/`contains_point`, and wrapping the ITEM counts `position()`, so
# both measure work done ON POINTS. A grid query that crosses a hundred empty cells does no
# work on any point and is invisible to both — which is how a 2.3x speed-up landed with the
# point count essentially unchanged, three separate times (docs/MEASURING.md 8b).
grid-stats = []

[dependencies]
# Keep this crate dependency-light on purpose: it is the core algorithm.
# rayon is the sole optional dependency, gated behind the `parallel` feature.
rayon = { workspace = true, optional = true }

[dev-dependencies]
# Benchmark harness (benches/spatial.rs). Dev-only — never in the shipped crate.
criterion = { workspace = true }
# Property-based fuzzing (tests/proptest_structures.rs): randomized op sequences
# vs a brute-force model, with shrinking. Dev-only.
proptest = "1"
# On-disk embedded KV engines (pure Rust). Dev-only — used ONLY by the
# cold-index example prototypes (redb = COW B-tree; fjall = LSM), to compare
# the read-optimized vs write-optimized engine. Never in the shipped crate.
redb = "2"
fjall = "2"

[[bench]]
name = "spatial"
harness = false
