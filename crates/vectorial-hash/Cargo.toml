[package]
name = "vectorial-hash"
version = "0.1.0"
description = "Index and hash algorithms for vectorial spaces, tuned to modern CPU architecture."
keywords = ["index", "hash", "spatial", "quadtree", "octree"]
categories = ["data-structures", "algorithms"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
# Leaf neighbour lists ("ropes") maintained on every split/merge, plus the
# accessor used by the flood-fill cull. Off by default: when disabled, the
# bookkeeping does not exist in the compiled code at all.
neighbors = []
# rayon-backed batch query helpers (`*::cull_many_par`). Off by default: the
# serial `cull_many` is always available and rayon stays out of the dependency
# tree entirely unless this is enabled.
parallel = ["dep:rayon"]

[dependencies]
# Keep this crate dependency-light on purpose: it is the core algorithm.
# rayon is the sole optional dependency, gated behind the `parallel` feature.
rayon = { workspace = true, optional = true }

[dev-dependencies]
# Benchmark harness (benches/spatial.rs). Dev-only — never in the shipped crate.
criterion = { workspace = true }

[[bench]]
name = "spatial"
harness = false
